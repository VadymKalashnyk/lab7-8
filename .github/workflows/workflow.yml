name: Python app deploy on aws by gitAction v1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        run: |
          python3 -m unittest test.py
        env:
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply (Ensure Lightsail Service)
        run: terraform apply -target=aws_lightsail_container_service.flask_service -input=false -auto-approve
        working-directory: terraform

      - name: Install lightsailctl plugin
        run: |
          sudo curl -sSL "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x "/usr/local/bin/lightsailctl"

      - name: Build and push image to Lightsail
        run: |
          docker build -t flask-app:latest .
          PUSH_OUTPUT=$(aws lightsail push-container-image --region eu-north-1 --service-name flask-app-service --label flask-app --image flask-app:latest)
          echo "$PUSH_OUTPUT"
          IMAGE_NAME=$(echo "$PUSH_OUTPUT" | grep "Refer to this image as" | sed -E 's/.*Refer to this image as "([^"]+)".*/\1/')
          echo "LIGHTSAIL_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Terraform Plan
        run: terraform plan -var="lightsail_image=${{ env.LIGHTSAIL_IMAGE }}" -no-color -input=false -refresh=true
        working-directory: terraform

      - name: Terraform Apply (Deploy Container)
        run: terraform apply -var="lightsail_image=${{ env.LIGHTSAIL_IMAGE }}" -input=false -auto-approve
        working-directory: terraform